# CodeRabbit Quality & Security Gate Configuration
# ITER Departmental Research Profile Portal

version: 2

language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "draft"
    drafts: false

  tools:
    phpstan:
      enabled: true
      level: "5"
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true

  # Custom security and architectural instructions for CodeRabbit
  instructions: |
    You are the Senior Security & Code Quality Gate for the ITER Departmental Research Profile Portal (PHP 8.2 + MySQL).
    Enforce the following non-negotiable standards on all PRs and commits:

    1. SECURITY & OWASP AUDIT:
       - SQL Injection: All database queries MUST use PDO prepared statements with bound parameters (`execute([$param])`). Raw string interpolation or concatenation in SQL is an immediate blocker.
       - Cross-Site Request Forgery (CSRF): State-changing operations (Create, Update, Delete, Revoke, Role changes) MUST use HTTP POST with `require_csrf()` and `csrf_field()`. Never allow state changes via HTTP GET.
       - Cross-Site Scripting (XSS): All dynamic variables output into HTML must pass through `e()` (`htmlspecialchars(..., ENT_QUOTES, 'UTF-8')`).
       - URI Scheme Validation: Any user-provided URL rendered inside `href` or `src` attributes MUST be sanitized using `safe_url()` to block `javascript:` or `data:` pseudo-protocols.
       - Authentication & Authorization: Endpoints mutating faculty profiles MUST strictly enforce `can_manage_faculty_profile($profileId)` or role checks via `require_role()`.
       - Session Security: Cookies must have `HttpOnly`, `SameSite=Lax`, and `strict_mode=1`.
       - Password Hashing: Only `password_hash()` with `PASSWORD_DEFAULT` and `password_verify()` are permitted.
       - Error Disclosure: Never leak database credentials, paths, or raw PDO error messages to end users.

    2. QUALITY & ARCHITECTURE (ZERO AI SLOP):
       - Reject generic boilerplate code, unnecessary complexity, or bloated dependencies.
       - Ensure proper database indexing on foreign keys and search filter columns.
       - Maintain clean modular architecture and reusable components under `includes/`.
       - All PHP files must pass syntax verification (`php -l`) and be compatible with PHP 8.2+.
       - Ensure accessible, responsive UI with semantic HTML elements.

chat:
  auto_reply: true
